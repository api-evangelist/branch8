aid: branch8
name: Branch8
description: >-
  Branch8 is a digital solutions and managed contracting company headquartered
  in Hong Kong with operations across Asia (Singapore, Taiwan, Vietnam, Malaysia,
  Indonesia, and the Philippines). Founded in 2015, it provides managed technical
  squads and blended onshore/offshore teams that deliver e-commerce
  implementation (Adobe Commerce, Shopify Plus, and marketplace operations on
  Shopee, Lazada, and Amazon), CRM and CDP strategy (Salesforce, HubSpot,
  Segment, mParticle, Braze, Dynamics 365), digital product and mobile
  engineering, AI and workflow automation (n8n, Make, Windmill), and data
  engineering (Snowflake, BigQuery, dbt, Fivetran). Branch8 serves mid-market to
  enterprise clients including Chow Tai Fook, Chow Sang Sang, Lacoste, Hong Kong
  International Airport, Hotai/Toyota, and HKBN. It is a services firm rather than
  an API producer and publishes no public developer API, but it does expose an
  agent-native llms.txt describing its services.
